id: linux_crypto_kem_decrypt
label: KEM Decrypt (X-Wing / libsodium)
category: '[gr-linux-crypto]/Sodium'
flags: [python, cpp]
templates:
  imports: |-
    from gnuradio import linux_crypto
  make: linux_crypto.kem_decrypt(${secret_key_file})
  callbacks:
  - set_secret_key_file(${secret_key_file})
parameters:
- id: secret_key_file
  label: Secret key file
  dtype: string
  default: '""'
  hide: none
  comment: "Raw X-Wing secret key (crypto_kem_SECRETKEYBYTES bytes)"
inputs:
- label: in
  domain: message
  id: in
outputs:
- label: out
  domain: message
  id: out

documentation: |-
  PDU block: decrypts PDUs from linux_crypto_kem_encrypt using crypto_kem_dec and
  crypto_secretbox_open_easy. Output is the recovered plaintext PDU.

file_format: 1
