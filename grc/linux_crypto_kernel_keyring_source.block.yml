id: linux_crypto_kernel_keyring_source
label: Kernel Keyring Source
category: '[gr-linux-crypto]/Sources'
flags: [python, cpp]
templates:
  imports: |-
    from gnuradio import linux_crypto
  make: linux_crypto.kernel_keyring_source(${key_id}, ${auto_repeat})
  callbacks:
  - set_key_id(${key_id})
  - set_auto_repeat(${auto_repeat})
parameters:
- id: key_id
  label: Key ID
  dtype: int
  default: 0
  hide: none
- id: auto_repeat
  label: Auto Repeat
  dtype: bool
  default: 'False'
  hide: none
inputs:
- label: ''
  domain: stream
  dtype: byte
  optional: true
outputs:
- label: out
  domain: stream
  dtype: byte
  vlen: 1

documentation: |-
  Reads key material from the Linux kernel keyring and outputs it as a byte stream.
  Key ID is the key serial (e.g. from keyctl add user). When Auto Repeat is true,
  the key data is repeated to fill the stream; when false, the key is output once
  then the block may pad or behave according to keyring semantics. Use this as a
  key source for encryption blocks (e.g. kernel_crypto_aes) or for key injection
  in flowgraphs. Keys are added with keyctl or gr_linux_crypto KeyringHelper.

file_format: 1
