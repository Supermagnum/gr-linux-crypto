id: linux_crypto_nitrokey_interface
label: Nitrokey Interface
category: '[gr-linux-crypto]/Hardware'
flags: [python, cpp]
templates:
  imports: |-
    from gnuradio import linux_crypto
  make: linux_crypto.nitrokey_interface(${slot}, ${auto_repeat})
  callbacks:
  - set_slot(${slot})
  - set_auto_repeat(${auto_repeat})
parameters:
- id: slot
  label: Slot Number
  dtype: int
  default: 0
  hide: none
- id: auto_repeat
  label: Auto Repeat
  dtype: bool
  default: 'False'
  hide: none
inputs:
- label: ''
  domain: stream
  dtype: byte
  optional: true
outputs:
- label: out
  domain: stream
  dtype: byte
  vlen: 1

documentation: |-
  Reads key or secret data from a Nitrokey password-safe slot and outputs it as
  a byte stream. Slot Number is the password-safe slot index (typically 0-15).
  Auto Repeat: when true, the slot data is repeated to fill the stream; when
  false, output is produced once. Requires libnitrokey and a connected Nitrokey.
  Use as key source for encryption blocks. If the device is disconnected,
  output may be zeros until reconnected and keys reloaded.

file_format: 1
