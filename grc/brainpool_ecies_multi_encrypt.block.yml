id: brainpool_ecies_multi_encrypt
label: Brainpool ECIES Multi-Recipient Encrypt
category: '[gr-linux-crypto]/Crypto'
flags: [python, cpp]
templates:
  imports: |-
    from gnuradio import linux_crypto
  make: linux_crypto.brainpool_ecies_multi_encrypt(${curve}, ${callsigns}, ${key_store_path}, ${kdf_info})
  callbacks:
  - set_callsigns(${callsigns})
  - set_kdf_info(${kdf_info})
parameters:
- id: curve
  label: Brainpool Curve
  dtype: string
  default: '"brainpoolP256r1"'
  options: ['"brainpoolP256r1"', '"brainpoolP384r1"', '"brainpoolP512r1"']
  hide: none
- id: callsigns
  label: Recipient Callsigns (comma-separated)
  dtype: string
  default: '""'
  hide: none
- id: key_store_path
  label: Key Store Path
  dtype: string
  default: '""'
  hide: none
- id: kdf_info
  label: KDF Info
  dtype: string
  default: '"gr-linux-crypto-ecies-v1"'
  hide: none
inputs:
- label: in
  domain: stream
  dtype: byte
  vlen: 1
- label: key_in
  domain: stream
  dtype: byte
  vlen: 1
  optional: true
outputs:
- label: out
  domain: stream
  dtype: byte
  vlen: 1

documentation: |-
  Multi-recipient ECIES (up to 25 recipients). Recipient Callsigns: comma-separated
  list (e.g. W1ABC,K2XYZ or group1,group2); required. Key Store Path: optional.
  JSON file can define key groups: "group1": ["key1","key2","key3"]; use group name
  in callsigns to encrypt for all members. Keys can be PEM, keygrip (40 hex), or
  key group (array). add_keygrip(callsign, keygrip); keyctl add user "callsign:X" "<keygrip>".
  gpg --list-secret-keys --with-keygrip. Use callsign as name or comment. Optional key_in.
  KDF Info must match decrypt. See multi_recipient_ecies_format.md.

file_format: 1

