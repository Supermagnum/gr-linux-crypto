[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"'; keyring timeout needs RUN_KEYRING_SLOW_TESTS=1)
    integration: marks tests as integration tests
    openssl: marks tests that require OpenSSL CLI

