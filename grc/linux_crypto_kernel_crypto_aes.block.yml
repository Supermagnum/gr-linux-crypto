id: linux_crypto_kernel_crypto_aes
label: Kernel Crypto AES
category: '[gr-linux-crypto]/Crypto'
flags: [python, cpp]
templates:
  imports: |-
    from gnuradio import linux_crypto
  make: linux_crypto.kernel_crypto_aes(${key}, ${iv}, ${mode}, ${encrypt})
  callbacks:
  - set_key(${key})
  - set_iv(${iv})
  - set_mode(${mode})
  - set_encrypt(${encrypt})
parameters:
- id: key
  label: AES Key
  dtype: raw
  default: '[0] * 32'
  hide: none
- id: iv
  label: IV
  dtype: raw
  default: '[0] * 16'
  hide: none
- id: mode
  label: Mode
  dtype: string
  default: '"cbc"'
  options: ['cbc', 'ecb', 'ctr', 'gcm']
  hide: none
- id: encrypt
  label: Encrypt
  dtype: bool
  default: 'True'
  hide: none
inputs:
- label: in
  domain: stream
  dtype: byte
  vlen: 1
outputs:
- label: out
  domain: stream
  dtype: byte
  vlen: 1

documentation: |-
  AES encryption/decryption using the Linux kernel crypto API (AF_ALG). Supports
  CBC, ECB, CTR, and GCM. Key and IV are set as parameters (e.g. 32 bytes for
  AES-256, 16 bytes for IV). Encrypt=true for encryption, false for decryption.
  For key material from keyring or hardware, feed a key stream into a separate
  keyring or Nitrokey source and use that flow for key input, or set key/IV
  from flowgraph variables. Block size is 16 bytes for CBC/ECB; use PKCS#7
  padding for arbitrary-length data.

file_format: 1
